[tool.poetry]
name = "fdr-orders-service"
version = "1.0.0"
description = "Servicio Core de Gestión de Órdenes para Flor del Río - Proyecto Final"
authors = ["Miguel Antonio Islas Martinez <migue@axity.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"
grpcio = "^1.62.0"
rich = "^13.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"
ruff = "^0.3.0"
pip-audit = "^2.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [
    "alembic/*",
    "src/infraestructura/adaptadores/stubs/*"
]

[tool.ruff.lint]
select = ["E", "F", "N", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
