name: Pipeline Integración Continua (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]

jobs:
  calidad-y-pruebas:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar Código del Repositorio
      uses: actions/checkout@v3

    - name: Configurar Entorno Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar Poetry y Dependencias
      run: |
        pip install poetry
        poetry install

    - name: Validar Estilo y Formato (Ruff Linter)
      run: poetry run ruff check src/

    - name: Ejecutar Suite de Pruebas Unitarias (Pytest)
      run: poetry run pytest
