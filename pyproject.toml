[tool.poetry]
name = "python-advanced-course"
version = "0.1.0"
description = "Estructura de laboratorios profesionales de Python Avanzado y Spark"
authors = ["Miguel <migue@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.13.4"
httpx = {extras = ["http2"], version = "^0.28.1"}
sqlalchemy = ">=2.0"
fastapi = "^0.137.1"
uvicorn = "^0.49.0"
pyjwt = "^2.13.0"
passlib = "^1.7.4"

[tool.poetry.group.dev.dependencies]
black = "^24.4.2"
isort = "^5.13.2"
ruff = "^0.4.4"
pre-commit = "^3.7.1"
mypy = "^1.10.0"
pytest = "^9.1.0"
pytest-cov = "^7.1.0"
hypothesis = "^6.155.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Movimos select e ignore dentro de su sección oficial
select = ["E", "F", "B", "I", "N", "W"]
ignore = []
